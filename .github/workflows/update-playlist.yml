name: Update default playlist

# Пересобирает assets/default-playlist/playlist.json из mp3-файлов в папке.
on:
  push:
    paths:
      - "assets/default-playlist/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate playlist.json
        run: |
          python3 - <<'PY'
          import json, os
          d = "assets/default-playlist"
          names = sorted(f for f in os.listdir(d) if f.lower().endswith(".mp3"))
          with open(os.path.join(d, "playlist.json"), "w", encoding="utf-8") as fh:
              json.dump({"tracks": names}, fh, ensure_ascii=False, indent=2)
              fh.write("\n")
          PY
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain assets/default-playlist/playlist.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add assets/default-playlist/playlist.json
            git commit -m "Update default playlist"
            git push
          fi
