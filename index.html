<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D Music Dancer</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Three.js через importmap (ES modules, без бандлера) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <div id="app">
    <div id="mobile-top-area">
      <div id="scene-container">
        <div id="scene-loading">
          <div class="loading-spinner"></div>
        </div>
      </div>

      <!-- Мобильная карточка "сейчас играет" — квадратная сцена + название/
           исполнитель под ней (десктоп продолжает показывать название в
           #player-secondary, эта разметка скрыта на десктопе через
           .mobile-only-control, см. style.css). -->
      <div id="track-info-mobile" class="mobile-only-control">
        <div id="track-title-mobile">
          <span id="track-title-text"></span>
        </div>
        <div id="track-artist-mobile"></div>
      </div>

      <!-- ВРЕМЕННО (тест звёздного туннеля, см. starTunnel.js) — панель
           визуализации аудио-значений: каждая строка — горизонтальный
           прямоугольник, заполняется цветом слева направо пропорционально
           значению (0..1), подпись — прямо внутри самого прямоугольника.
           Раньше здесь была текстовая debug-панель, видимая только через
           ?debug в адресной строке — теперь всегда видна, специально для
           наглядного тестирования новых реакций визуализатора. -->
      <div id="audio-debug">
        <div class="debug-bar"><div class="debug-bar-fill" id="dbg-bar-volume"></div><span class="debug-bar-label">volume</span></div>
        <div class="debug-bar"><div class="debug-bar-fill" id="dbg-bar-bass"></div><span class="debug-bar-label">bass</span></div>
        <div class="debug-bar"><div class="debug-bar-fill" id="dbg-bar-mid"></div><span class="debug-bar-label">mid</span></div>
        <div class="debug-bar"><div class="debug-bar-fill" id="dbg-bar-treble"></div><span class="debug-bar-label">treble</span></div>
        <div class="debug-bar"><div class="debug-bar-fill" id="dbg-bar-intensity"></div><span class="debug-bar-label">intensity</span></div>
        <div class="debug-bar"><div class="debug-bar-fill" id="dbg-bar-riserate"></div><span class="debug-bar-label">rise rate</span></div>
        <div class="debug-bar"><div class="debug-bar-fill is-beat" id="dbg-bar-beat"></div><span class="debug-bar-label">beat</span></div>
        <div class="debug-bar"><div class="debug-bar-fill is-strong-beat" id="dbg-bar-strongbeat"></div><span class="debug-bar-label">strong beat</span></div>
      </div>

      <div id="dance-controls" aria-label="Character & dance pool controls">
        <div id="character-stack"></div>
        <div id="avatar-picker" hidden></div>
      </div>

      <div id="player" aria-label="Audio player">
        <div id="player-transport">
          <!-- Мобильные кнопки плейлиста (shuffle/prev/next/repeat) — скрыты
               на десктопе через .mobile-only-control (см. style.css), там нет
               отдельного UI под них, но JS-логика плейлиста работает
               одинаково везде, просто на десктопе нет кнопок для неё. -->
          <button id="shuffle-btn" class="mobile-only-control transport-icon-btn" aria-label="Shuffle" aria-pressed="false" title="Перемешать порядок треков">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
          </button>
          <!-- Пустой разделитель — только для того, чтобы принудительно
               перенести кнопки плейлиста на свою (третью) строку на
               мобильном (flex-basis:100%, нулевой высоты, невидимый).
               Без него пришлось бы вешать flex-basis:100% на сам shuffle-btn,
               что искажало бы его собственную ширину. -->
          <div id="transport-row-break" class="mobile-only-control" aria-hidden="true"></div>
          <button id="prev-track-btn" class="mobile-only-control transport-icon-btn" aria-label="Previous track" title="Предыдущий трек">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>

          <button id="play-btn" class="icon-btn" aria-label="Play" disabled>
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </button>

          <button id="next-track-btn" class="mobile-only-control transport-icon-btn" aria-label="Next track" title="Следующий трек">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>
          <button id="repeat-btn" class="mobile-only-control transport-icon-btn" aria-label="Repeat" aria-pressed="false" title="Повтор плейлиста">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
          </button>

          <span id="time-current" class="time">00:00</span>
          <div id="progress-wrap">
            <canvas id="waveform-canvas"></canvas>
            <input id="progress" type="range" min="0" max="100" value="0" step="0.1" disabled />
          </div>
          <span id="time-duration" class="time">00:00</span>
        </div>

        <!-- Полоска-хендл для свайпа списка треков вверх — мобильная. -->
        <button id="playlist-drag-handle" class="mobile-only-control" aria-label="Открыть список треков" aria-expanded="false">
          <span class="handle-bar"></span>
        </button>

        <div id="player-secondary">
          <label id="volume-wrap">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3z"/></svg>
            <input id="volume" type="range" min="0" max="1" step="0.01" value="1" />
          </label>

          <button id="choose-audio-btn">Choose Audio</button>
          <input id="audio-file-input" type="file" multiple hidden />

          <button id="waveform-toggle" class="text-toggle-btn" aria-pressed="false" title="Переключить вид прогресс-бара">〜</button>

          <span id="track-name"></span>
        </div>
      </div>
    </div>

    <!-- Список треков — выезжает снизу поверх/вместо нижней части экрана
         при свайпе #playlist-drag-handle вверх. Мобильный, десктоп его не
         видит (.mobile-only-control). -->
    <div id="playlist-sheet" class="mobile-only-control" aria-hidden="true">
      <!-- Полоска-хендл внутри самой шторки — старый хендл (в #player)
           теперь скрыт ПОД шторкой, когда она открыта (шторка — отдельный
           слой поверх всего, см. style.css #playlist-sheet). Нужен свой,
           видимый, чтобы было чем закрыть обратно. -->
      <button id="playlist-sheet-handle" aria-label="Закрыть список треков">
        <span class="handle-bar"></span>
      </button>
      <div id="playlist-sheet-buttons-row">
        <button id="playlist-add-btn">+ Add Track</button>
        <button id="playlists-btn">Default Playlist</button>
      </div>
      <div id="playlist-items"></div>
    </div>

    <!-- Попап "Плейлисты" — список сохранённых плейлистов + создание
         нового. Скрыт по умолчанию (display управляется через main.js). -->
    <div id="playlists-popup-overlay" hidden>
      <div id="playlists-popup">
        <div id="playlists-popup-header">
          <span id="playlists-popup-title">Playlists</span>
          <button id="playlists-popup-close" aria-label="Close">✕</button>
        </div>
        <div id="playlists-popup-list"></div>
        <button id="playlists-popup-create-btn">+ New Playlist</button>
        <div id="playlists-popup-name-row" hidden>
          <input id="playlists-popup-name-input" type="text" placeholder="Playlist name" maxlength="60" />
          <button id="playlists-popup-name-confirm">Next</button>
        </div>
      </div>
    </div>

    <!-- Попап "Settings" — в отличие от попапа плейлистов, не прижат к
         низу экрана, а по центру (чуть выше середины). Сейчас внутри
         только переключатель языка — сам по себе цикличная кнопка, той
         же природы, что и масштаб сцены (ENG→UKR→RU→ENG...), БЕЗ
         реального перевода интерфейса — та логика будет отдельной
         следующей правкой, здесь только сам переключатель. -->
    <div id="settings-popup-overlay" hidden>
      <div id="settings-popup">
        <div id="settings-popup-header">
          <span id="settings-popup-title">Settings</span>
          <button id="settings-popup-close" aria-label="Close">✕</button>
        </div>
        <div id="settings-popup-content">
          <div class="settings-row">
            <span class="settings-row-label">Language</span>
            <button id="settings-language-btn" class="settings-cycle-btn">ENG</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
